name: NixBSD test

on:
  push:
    branches: [ tmp-hounds-merged ]
  pull_request:
  workflow_dispatch:

jobs:
  nix-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            install-nix: true
          - os: macos-26
            runner: macos-26
            install-nix: true
          - os: freebsd
            runner: [self-hosted, freebsd]
            install-nix: false
    
    runs-on: ${{ matrix.runner }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        if: matrix.install-nix
        uses: cachix/install-nix-action@v31.8.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Build and test
        run: |
          nix-build -A hello
          nix-env --version
          nix-instantiate --version
